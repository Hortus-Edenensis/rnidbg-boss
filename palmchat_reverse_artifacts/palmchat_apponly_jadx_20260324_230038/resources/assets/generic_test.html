<body style="background-color:transparent;background: rgba(0,0,0,0.2);">
    <script type="text/javascript" src="/zx_local_res/jssdk/cordova.js"></script>
    <script type="text/javascript" src="/zx_local_res/jssdk/zx.js"></script>
    <script type="text/javascript">
        var app = {
            // Application Constructor
            initialize: function() {
                this.bindEvents();
            },

            // Bind Event Listeners
            //
            // Bind any events that are required on startup. Common events are:
            // 'load', 'deviceready', 'offline', and 'online'.
            bindEvents: function() {
                document.addEventListener('deviceready', this.onDeviceReady, false);
            },

            // deviceready Event Handler
            //
            // The scope of 'this' is the event. In order to call the 'receivedEvent'
            // function, we must explicitly call 'app.receivedEvent(...);'
            onDeviceReady: function() {
                alert("onDeviceReady ua="+navigator.userAgent);
            }
        };

        app.initialize();
        function showToast() {
            zx.execAction("showToast", {'content':'这个是一个toast', 'duration':1}, null);
        };

        function saveUrlImage() {
            zx.execAction("saveUrlImage", {'imgUrl':'https://www.baidu.com/img/bd_logo1.png'}, function (data) {
                alert(JSON.stringify(data));
            });
        };
        function getLocation() {
            zx.execAction("getLocation", {}, function (data) {

            });
        };
        function getLastLocation() {

            zx.execAction("closeWindow", {}, function (data) {

        }

                alert(JSON.stringify(data));

        }

        function trace() {
            zx.execAction("trace", {"eventId":"test_event_id","reportType":"click","ext":{"extraKey":"extraValue"}}, function (data) {
                alert(JSON.stringify(data));

        }
